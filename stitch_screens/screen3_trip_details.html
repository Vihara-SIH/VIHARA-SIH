<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vihara - Trip Planning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#000000",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#b9c7e4",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#2e1500",
                        "surface-container-low": "#f4f4ef",
                        "surface-container-lowest": "#ffffff",
                        "surface-dim": "#dadad5",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#ffe088",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#c66d00",
                        "inverse-on-surface": "#f1f1ec",
                        "surface-tint": "#515f78",
                        "on-primary-fixed": "#0d1c32",
                        "on-primary-container": "#76849f",
                        "secondary": "#735c00",
                        "surface-container-highest": "#e3e3de",
                        "background": "#fafaf5",
                        "tertiary-fixed-dim": "#ffb77a",
                        "inverse-surface": "#2f312e",
                        "surface-variant": "#e3e3de",
                        "on-background": "#1a1c19",
                        "on-tertiary-fixed": "#2e1500",
                        "surface-container": "#eeeee9",
                        "surface-container-high": "#e8e8e3",
                        "primary-container": "#0d1c32",
                        "primary": "#000000",
                        "on-secondary-fixed-variant": "#574500",
                        "on-primary-fixed-variant": "#39475f",
                        "primary-fixed": "#d6e3ff",
                        "on-surface": "#1a1c19",
                        "surface": "#fafaf5",
                        "secondary-fixed-dim": "#e9c349",
                        "tertiary-fixed": "#ffdcc2",
                        "primary-fixed-dim": "#b9c7e4",
                        "secondary-container": "#fed65b",
                        "surface-bright": "#fafaf5",
                        "on-secondary-fixed": "#241a00",
                        "on-tertiary-fixed-variant": "#6d3a00",
                        "outline-variant": "#c5c6cd",
                        "outline": "#75777e",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#44474d",
                        "on-secondary-container": "#745c00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "48px",
                        "xl": "80px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "base": "8px",
                        "sm": "12px",
                        "margin-desktop": "64px",
                        "md": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Montserrat"],
                        "label-caps": ["Montserrat"],
                        "display-lg-mobile": ["Montserrat"],
                        "body-md": ["Inter"],
                        "display-lg": ["Montserrat"],
                        "body-lg": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 16px 48px rgba(10, 25, 47, 0.12);
        }
        .lotus-corner {
            border-top-right-radius: 1.5rem;
        }
        .input-underline {
            border: none;
            border-bottom: 1px solid rgba(10, 25, 47, 0.1);
            background: transparent;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-underline:focus {
            outline: none;
            box-shadow: none;
            border-color: #D4AF37; /* Antique Gold approx */
        }
    </style>
</head>
<body class="font-body-md text-on-surface bg-surface antialiased min-h-screen relative">
<!-- Background Image -->
<div class="fixed inset-0 w-full h-full z-0">
<img class="w-full h-full object-cover" data-alt="A cinematic, wide-angle shot of the Golden Temple in Amritsar at twilight. The golden structure glows warmly against a purple and orange sky, reflecting perfectly in the serene surrounding water. The aesthetic is luxurious, peaceful, and culturally rich, embodying high-end heritage travel with deep indigo and gold tones." src="https://lh3.googleusercontent.com/aida/AEtjO1XHmihFs15lCpGPZY7GPJjgpBndMCJFn5l4EkwD3IBIPeGBjDstBhnD8DjH2PQbmJg3nYlDCFAUwwep6GIXeq-L0mww2K9lZf7X8EKFngJyuZN-DgHy6QfL0o2_43zhf5vajIt-BPcWajB1oLuJFe7-_ZUXcIlRwNl2ALgr7Gj4tsb2Sek2qyZotyvZEIMLLoRskwYajbFKhfdfE9TF8oB5Hi0ifnh0QjuT9w-JLQt_ssfkNzwEWM7n-Fs"/>
<div class="absolute inset-0 bg-primary/30"></div>
</div>
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-md border-b border-secondary/30 shadow-sm flex justify-between items-center px-margin-desktop py-4 max-w-7xl mx-auto w-full">
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">
            Vihara
        </div>
<div class="hidden md:flex items-center gap-gutter">
<!-- Suppressed nav items as this is a transactional flow, but keeping structure per instructions if needed, though instructions say to hide shell if linear. Will hide tabs but keep login. -->
</div>
<div>
<a class="font-label-caps text-label-caps text-primary dark:text-inverse-primary hover:text-secondary dark:hover:text-secondary-fixed transition-colors duration-200" href="#">
                Login
            </a>
</div>
</nav>
<!-- Main Content -->
<main class="relative z-10 flex items-center justify-center min-h-screen pt-xl pb-lg px-margin-mobile md:px-margin-desktop">
<div class="glass-card w-full max-w-2xl rounded-xl p-md md:p-lg lotus-corner">
<h1 class="font-display-lg-mobile md:font-display-lg text-primary mb-lg text-center">
                Design Your Journey
            </h1>
<form class="space-y-xl">
<!-- Destination -->
<div class="space-y-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="current-location">Your Current Location</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-on-surface-variant pointer-events-none" data-icon="location_on">location_on</span>
<input class="input-underline w-full font-body-lg text-body-lg text-primary pb-sm pl-8" id="current-location" name="current-location" placeholder="Enter your city" type="text"/>
<button class="absolute right-0 flex items-center gap-xs text-label-caps font-label-caps text-secondary hover:text-on-secondary-container transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="my_location">my_location</span>
            Detect
        </button>
</div>
</div><div class="space-y-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="destination">Select the place you want to visit</label>
<div class="relative">
<select class="input-underline w-full font-body-lg text-body-lg text-primary pb-sm cursor-pointer appearance-none" id="destination" name="destination">
<option disabled="" selected="" value="">Choose a destination</option>
<option value="delhi">Delhi</option>
<option value="jaipur">Jaipur</option>
<option value="varanasi">Varanasi</option>
<option value="kerala">Kerala</option>
<option value="rajasthan">Rajasthan</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
<!-- Duration -->
<div class="space-y-base">
<label class="block font-label-caps text-label-caps text-on-surface-variant" for="duration">Select the number of days</label>
<div class="relative">
<input class="input-underline w-full font-body-lg text-body-lg text-primary pb-sm" id="duration" max="30" min="1" name="duration" placeholder="e.g. 7" type="number"/>
</div>
</div>
<!-- Company -->
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-md">Travelling Company</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm">
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="company" type="radio" value="solo"/>
<div class="border border-outline-variant rounded-lg p-sm text-center font-body-md text-on-surface-variant transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container group-hover:border-secondary">
                                Solo
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="company" type="radio" value="couple"/>
<div class="border border-outline-variant rounded-lg p-sm text-center font-body-md text-on-surface-variant transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container group-hover:border-secondary">
                                Couple
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="company" type="radio" value="family"/>
<div class="border border-outline-variant rounded-lg p-sm text-center font-body-md text-on-surface-variant transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container group-hover:border-secondary">
                                Family
                            </div>
</label>
<label class="cursor-pointer relative group">
<input class="peer sr-only" name="company" type="radio" value="friends"/>
<div class="border border-outline-variant rounded-lg p-sm text-center font-body-md text-on-surface-variant transition-colors peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container group-hover:border-secondary">
                                Friends
                            </div>
</label>
</div>
</div>
<!-- CTA -->
<div class="pt-lg flex justify-end">
<button class="bg-secondary-container text-on-secondary-container font-label-caps text-label-caps px-xl py-md rounded-lg hover:bg-secondary-fixed transition-colors flex items-center gap-base" type="button">
                        NEXT
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
