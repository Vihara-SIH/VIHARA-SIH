    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <style>
      .ken-burns {
        animation: kenBurns 20s infinite alternate linear;
      }
      @keyframes kenBurns {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.1) translate(-2%, -2%); }
      }
      .slide {
        opacity: 0;
        transition: opacity 2s ease-in-out;
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .slide.active {
        opacity: 1;
        z-index: 1;
      }
      .overlay-gradient {
        background: linear-gradient(to bottom, rgba(13, 28, 50, 0.2), rgba(13, 28, 50, 0.6));
        mix-blend-mode: multiply;
      }
      .saffron-tint {
        background-color: rgba(254, 214, 91, 0.1);
        mix-blend-mode: overlay;
      }
      @keyframes revealLetter {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.85);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-letter {
        opacity: 0;
        display: inline-block;
        animation: revealLetter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .logo-flow-transition {
        transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .glow-gold {
        text-shadow: 0 0 14px rgba(212, 175, 55, 0.8), 0 0 28px rgba(212, 175, 55, 0.4);
        transition: text-shadow 2s ease-in;
      }
      .glass-panel {
        background: rgba(250, 250, 245, 0.1);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .glass-btn {
        background: rgba(13, 28, 50, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        transition: all 0.3s ease;
      }
      .glass-btn:hover {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        border-color: rgba(212, 175, 55, 0.8);
        transform: translateY(-2px);
      }
      .logo-flow-transition {
        transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
    </style>
  </head>
  <body class="bg-primary-container text-surface m-0 p-0 overflow-x-hidden font-body-md">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
