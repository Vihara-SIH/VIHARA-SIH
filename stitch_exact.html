&lt;script&gt;
        // Logo Animation
        document.addEventListener('DOMContentLoaded', () =&gt; {
            const iharaText = document.getElementById('ihara-text');
            const logoElement = document.getElementById('vihara-logo');
            const divider = document.getElementById('vihara-divider');
            
            setTimeout(() =&gt; {
                iharaText.classList.remove('-translate-x-full');
                iharaText.classList.add('translate-x-0');
            }, 600);
            
            setTimeout(() =&gt; {
                logoElement.classList.add('glow-gold');
                divider.classList.add('glow-gold');
            }, 2200);

            // Slideshow Logic
            const slides = document.querySelectorAll('.slide');
            const indicators = document.querySelectorAll('.indicator');
            let currentSlide = 0;
            const slideCount = slides.length;
            let slideInterval;

            function showSlide(index) {
                slides.forEach(s =&gt; s.classList.remove('active'));
                indicators.forEach(i =&gt; {
                    i.classList.remove('bg-surface');
                    i.classList.add('bg-surface/30');
                });
                
                slides[index].classList.add('active');
                indicators[index].classList.remove('bg-surface/30');
                indicators[index].classList.add('bg-surface');
                currentSlide = index;
            }

            function nextSlide() {
                let next = (currentSlide + 1) % slideCount;
                showSlide(next);
            }

            function prevSlide() {
                let prev = (currentSlide - 1 + slideCount) % slideCount;
                showSlide(prev);
            }

            function startSlideshow() {
                slideInterval = setInterval(nextSlide, 3000); // 3 seconds per slide
            }

            function resetSlideshow() {
                clearInterval(slideInterval);
                startSlideshow();
            }

            document.getElementById('next-slide').addEventListener('click', () =&gt; {
                nextSlide();
                resetSlideshow();
            });

            document.getElementById('prev-slide').addEventListener('click', () =&gt; {
                prevSlide();
                resetSlideshow();
            });

            indicators.forEach(ind =&gt; {
                ind.addEventListener('click', (e) =&gt; {
                    let index = parseInt(e.target.getAttribute('data-index'));
                    showSlide(index);
                    resetSlideshow();
                });
            });

            startSlideshow();
        });
    &lt;/script&gt;
